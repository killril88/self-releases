[program:zb_node_front_release]
directory=/var/www/zhilibyli/frontend_releases/current/
command=/var/www/zhilibyli/frontend_releases/shared/node-v24.14.0/bin/pnpm run --filter main start
process_name=%(program_name)s_%(process_num)02d
numprocs=3
numprocs_start=0
user=zhilibyli
environment=NODE_ENV="production",PORT="300%(process_num)s"

stdout_logfile=/var/log/supervisor/node_front-release-%(process_num)02d-out.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stderr_logfile=/var/log/supervisor/node_front-release-%(process_num)02d-err.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=5

autostart=true
autorestart=true
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true
