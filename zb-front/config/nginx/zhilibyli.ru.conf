# ===================================================
# this zhilibyli.ru nginx config is synced with git
# ===================================================

upstream zb_frontend_release {
    least_conn;
    server 127.0.0.1:3000;
    server 127.0.0.1:3001;
    server 127.0.0.1:3002;
    keepalive 32;
}

#opening_bracket_server_block
server  {

    client_max_body_size 100M;
    server_name zhilibyli.ru;
    root /var/www/zhilibyli/frontend_releases/current/apps/zhilibyli/public;
    access_log  /var/log/nginx/zhilibyli.access.log;
    error_log  /var/log/nginx/zhilibyli.error.log;


    # =========================
    # DDOS_GUARD
    # =========================

    set_real_ip_from 77.220.207.0/24;
    set_real_ip_from 45.10.240.0/24;
    set_real_ip_from 45.10.241.0/24;
    set_real_ip_from 45.10.242.0/24;
    set_real_ip_from 186.2.160.0/24;
    set_real_ip_from 186.2.164.0/24;
    set_real_ip_from 186.2.167.0/24;
    set_real_ip_from 186.2.168.0/24;
    set_real_ip_from 51.250.108.155;
    set_real_ip_from 178.154.197.84;
    set_real_ip_from 10.129.0.38;
    real_ip_header X-Forwarded-For;


    # =========================
    # ERRORS_HANDLING
    # =========================

    #show custom 503.html page if 503's occurs
    error_page 503 /503.html;
    location = /503.html  {
    root /var/www/zhilibyli/frontend_releases/current/apps/zhilibyli/public/static;
    internal;
    }


    # =========================
    # WG0_HEALTH_CHECK
    # =========================

    location = /internal-health/wg0 {
    allow 153.80.204.232;
    deny all;

    proxy_pass http://127.0.0.1:9105/health;
    proxy_http_version 1.1;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_set_header Host 127.0.0.1;
    access_log off;
    }

    location = /internal-health/nginx-status {
    stub_status;
    access_log off;
    allow 153.80.204.232;
    deny all;
    }

    location = /internal-health/redis-cache {
    allow 153.80.204.232;
    deny all;

    proxy_pass http://127.0.0.1:9106/health;
    proxy_http_version 1.1;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_set_header Host 127.0.0.1;
    access_log off;
    }

    location = /internal-health/next-rss {
    allow 153.80.204.232;
    deny all;

    proxy_pass http://127.0.0.1:9107/health;
    proxy_http_version 1.1;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_set_header Host 127.0.0.1;
    access_log off;
    }


    # =========================
    # DEFAULT_LOCATION
    # =========================

    location /  {

    # Maintenance mode check
    # if (-f /etc/nginx/maintenance.enable)  {
    # return 503;
    # }

    #set yandex & ddos-guard dns
    resolver 77.88.8.8 185.129.101.200 ipv6=off;
    set $empty "";

    proxy_set_header   X-Forwarded-For $remote_addr;
    proxy_set_header   Host $http_host;
    proxy_pass         http://zb_frontend_release;
    }


    # ===================================
    # APPLE_APP_SITE_ASSOSIATION_(AASA)
    # ===================================

    #Связка сайта с мобильным приложением
    location = /apple-app-site-association  {
    proxy_pass https://10.129.0.40:443/storage/apple/apple-app-site-association;
    proxy_redirect off;
    proxy_set_header Host re662zjkfh.zhilibyli.ru;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # важно для iOS
    default_type application/json;
    }


    # =========================
    # WIDGETS
    # =========================

    #Используется для сторонних ресурсов

    location /widgets/  {
    proxy_pass https://10.129.0.40:443;
    # в конце слэш не ставим, чтобы урл не менялся при проксировании на бэк ( фронт /widgets/some --> бэк /widgets/some )
    proxy_ssl_verify off;
    # подключается по HTTPS, но не проверяет, к кому именно он подключился
    proxy_redirect     off;
    proxy_set_header   Host re662zjkfh.zhilibyli.ru;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    }


    # =========================
    # YANDEX_DZEN_REDIRECT
    # =========================

    #Редирект в яндекс дзен на группу ЖБ

    location /dz_redirect  {
    return https://dzen.ru/zhilibyli_ru;
    }


    # =========================
    # SEO_ROBOTS
    # =========================

    location  ~ robots.txt  {
    root /var/www/zhilibyli/storage/sitemaps/$host;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires 0;
    }


    # ==========================
    # GOOGLE_PLAY_VERIFICATION
    # ==========================

    location  ~ google05110bde4e5b8b8f.html  {
    root /var/www/zhilibyli/storage/sitemaps/zhilibyli.ru;
    }

    location /.well-known/assetlinks.json  {
    proxy_pass https://10.129.0.40:443;
    rewrite /.well-known/assetlinks.json /storage/well-known/assetlinks.json  break;
    proxy_redirect     off;
    proxy_set_header   Host re662zjkfh.zhilibyli.ru;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    }


    # =========================
    # SITEMAPS
    # =========================

    #gzip sitemaps
    location ~ ^/sitemap.*\.xml\.gz$  {
    root /var/www/zhilibyli/storage/sitemaps_v2/zhilibyli.ru;
    try_files $uri =404;
    default_type application/xml;
    add_header Content-Encoding gzip always;
    add_header Cache-Control "public, max-age=3600" always;
    }

    #xml sitemaps
    location ~ ^/sitemap.*\.xml$  {
    root /var/www/zhilibyli/storage/sitemaps_v2/zhilibyli.ru;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600" always;
    }


    # =========================
    # IMAGES
    # =========================

    #конечный каталог примонтирован с бэкенда zb-back 10.129.0.40
    location /storage/images/  {
    alias /var/www/zhilibyli/storage/images/;
    }


    # =========================
    # GRAPHQL
    # =========================

    location = /api/graphql  {
    proxy_pass         https://10.129.0.40:443;
    proxy_http_version 1.1;
    proxy_redirect     off;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   Host re662zjkfh.zhilibyli.ru;
    }


    # =========================
    # CLIENT_API
    # =========================

    location  /api/client/  {
    proxy_pass         https://10.129.0.40:443;
    proxy_http_version 1.1;
    proxy_redirect     off;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   Host re662zjkfh.zhilibyli.ru;
    }

    # =========================
    # MOBILE_APP_PUSH_TOKENS
    # =========================

    location           /mobile-app/push-tokens  {
    #rewrite            /mobile-app/push-token/(.*) /mobile-app/push-token/$1  break;
    proxy_pass         https://10.129.0.40:443;
    proxy_redirect     off;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   Host re662zjkfh.zhilibyli.ru;
    }


    # =========================
    # HTTPS_CONFIG_BLOCK
    # =========================

    #listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl;
    include /etc/nginx/ssl-options.conf;
    ssl_certificate /etc/nginx/fullchain.pem;
    ssl_certificate_key /etc/nginx/privkey.pem;
}



#closing_bracket_server_block


#config for http 80 port
#opening_bracket_server_block
server  {

    listen 80;
    server_name zhilibyli.ru;
    client_max_body_size 100M;
    access_log  /var/log/nginx/zhilibyli.ru.access.log;
    error_log  /var/log/nginx/zhilibyli.error.log;

    location /  {
    return 301 https://$host$request_uri;
    }

    location  /api/graphql  {
    proxy_pass         http://10.129.0.40:80;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_redirect     off;
    proxy_set_header   Host re662zjkfh.zhilibyli.ru;
    }

}
#closing_bracket_server_block


#redirect [.kz] [.com] [.рф] [www] to zhilibyli.ru
server  {

    listen 80;
    listen 443 ssl;
    server_name zhilibyli.kz zhilibyli.com xn--90ajgabpc1k.xn--p1ai www.zhilibyli.ru;
    client_max_body_size 100M;
    access_log  /var/log/nginx/zhilibyli.kz_com_rf.access.log;
    error_log   /var/log/nginx/zhilibyli.kz_com_rf.error.log;

    location /  {
    return 301 https://zhilibyli.ru$request_uri;
    }

}

#stub nginx location for zabbix monitoring
server  {
    listen 127.0.0.1:8080;
    location /nginx_status  {
    stub_status;
    access_log off;
    allow 127.0.0.1;
    deny all;
    }
}
